<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>C Assignment Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      border: none;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #2563eb;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    .program {
      margin-top: 20px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 10px;
    }

    .program button {
      margin-top: 10px;
    }

    .hint {
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>C Assignment Generator</h1>

  <label>Student ID</label>

  <input
    id="studentId"
    type="text"
    placeholder="Enter your Student ID"
  >


  <label>Number of Programs</label>

  <input
    id="count"
    type="number"
    value="1"
    min="1"
    max="20"
  >


  <label>Google Form Link</label>

  <input
    id="formUrl"
    type="url"
    placeholder="Paste Google Form link here"
  >

  <button
    id="detectBtn"
    class="secondary"
  >
    Detect Questions from Google Form
  </button>


  <label>Assignment Questions</label>

  <textarea
    id="questions"
    placeholder="Paste your assignment questions here..."
  ></textarea>

  <div class="hint">
    You can either paste questions manually or detect them from a Google Form.
  </div>


  <label>OR Upload Assignment Image</label>

  <input
    id="image"
    type="file"
    accept="image/*"
  >


  <button id="generateBtn">
    Generate C Programs
  </button>


  <div id="status"></div>

  <div id="results"></div>

</div>


<script>

const detectBtn =
  document.getElementById("detectBtn");

const generateBtn =
  document.getElementById("generateBtn");

const status =
  document.getElementById("status");

const questionsBox =
  document.getElementById("questions");

const results =
  document.getElementById("results");


/* =========================
   DETECT GOOGLE FORM
========================= */

detectBtn.addEventListener(
  "click",
  async () => {

    const url =
      document
        .getElementById("formUrl")
        .value
        .trim();

    if (!url) {
      status.innerText =
        "Please paste a Google Form link.";

      return;
    }

    status.innerText =
      "Reading Google Form...";

    detectBtn.disabled = true;

    try {

      const response =
        await fetch(
          "/api/form-questions",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              url
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {
        throw new Error(
          data.error ||
          "Could not read form."
        );
      }

      questionsBox.value =
        data.questions
          .map(
            (q, i) =>
              `${i + 1}. ${q}`
          )
          .join("\n\n");

      document.getElementById("count").value =
        data.questions.length;

      status.innerText =
        `Detected ${data.questions.length} question(s).`;

    } catch (error) {

      status.innerText =
        "Error: " + error.message;

    } finally {

      detectBtn.disabled = false;

    }

  }
);


/* =========================
   GENERATE PROGRAMS
========================= */

generateBtn.addEventListener(
  "click",
  async () => {

    const studentId =
      document
        .getElementById("studentId")
        .value
        .trim();

    const count =
      document
        .getElementById("count")
        .value;

    const questions =
      questionsBox.value.trim();

    const imageInput =
      document.getElementById("image");


    if (!studentId) {

      status.innerText =
        "Please enter your Student ID.";

      return;
    }


    if (!questions &&
        imageInput.files.length === 0) {

      status.innerText =
        "Please enter questions, detect them from a Google Form, or upload an image.";

      return;
    }


    status.innerText =
      "Generating C programs...";

    results.innerHTML = "";

    generateBtn.disabled = true;


    const formData =
      new FormData();

    formData.append(
      "studentId",
      studentId
    );

    formData.append(
      "count",
      count
    );

    formData.append(
      "questions",
      questions
    );


    if (imageInput.files.length > 0) {

      formData.append(
        "image",
        imageInput.files[0]
      );

    }


    try {

      const response =
        await fetch(
          "/api/generate",
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Generation failed."
        );

      }


      status.innerText =
        `Generated ${data.programs.length} program(s).`;


      data.programs.forEach(
        (program) => {

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "program";


          const title =
            document.createElement(
              "h3"
            );

          title.innerText =
            program.filename;


          const question =
            document.createElement(
              "p"
            );

          question.innerText =
            program.question;


          const button =
            document.createElement(
              "button"
            );

          button.innerText =
            "Download " +
            program.filename;


          button.onclick =
            () => {

              const blob =
                new Blob(
                  [program.code],
                  {
                    type:
                      "text/plain"
                  }
                );


              const url =
                URL.createObjectURL(
                  blob
                );


              const a =
                document.createElement(
                  "a"
                );

              a.href = url;

              a.download =
                program.filename;

              a.click();

              URL.revokeObjectURL(
                url
              );

            };


          div.appendChild(title);
          div.appendChild(question);
          div.appendChild(button);

          results.appendChild(div);

        }
      );


    } catch (error) {

      status.innerText =
        "Error: " +
        error.message;

    } finally {

      generateBtn.disabled = false;

    }

  }
);

</script>

</body>
</html>
